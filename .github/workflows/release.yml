name: Gateway release

on:
  push:
    branches: [gateway]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  prepare:
    if: github.repository == 'qazpytre/herdr-gateway'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      revision: ${{ steps.identity.outputs.revision }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - id: identity
        run: |
          base=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          revision=$((GITHUB_RUN_NUMBER + 1))
          echo "tag=gateway-$base-$revision" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  build:
    needs: [checks, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: herdr-gateway-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: herdr-gateway-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.96.1
          targets: ${{ matrix.target }}
      - uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943
        with:
          version: 0.16.0
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake ninja-build
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: gateway-${{ matrix.target }}
      - name: Build fork artifact
        shell: bash
        env:
          HERDR_BUILD_CHANNEL: gateway
          HERDR_BUILD_ID: ${{ needs.prepare.outputs.revision }}
          HERDR_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo build --release --locked --target '${{ matrix.target }}'
          cp 'target/${{ matrix.target }}/release/herdr' '${{ matrix.asset }}'
      - name: Verify static Linux binary and fork identity
        if: runner.os == 'Linux'
        env:
          ASSET: ${{ matrix.asset }}
          REVISION: ${{ needs.prepare.outputs.revision }}
        run: |
          set -euo pipefail
          file "$ASSET"
          if readelf -l "$ASSET" | grep -q INTERP; then
            echo 'Linux artifact must not require a dynamic loader' >&2
            exit 1
          fi
          base=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          test "$(./"$ASSET" --version)" = "herdr $base-gateway.$REVISION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: [build, prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate fork manifest with archived builds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -n "$previous" ]; then
            mkdir history
            gh release download "$previous" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir history
            python3 scripts/gateway_release.py --tag "$RELEASE_TAG" --artifacts artifacts --previous history/latest.json
          else
            python3 scripts/gateway_release.py --tag "$RELEASE_TAG" --artifacts artifacts
          fi
      - name: Publish immutable binaries and fork feed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/* distribution/install-gateway.sh \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "$RELEASE_TAG" \
            --notes 'Install or update with herdr-gateway update --machines. Remote restarts remain explicit; --handoff opts into live handoff. See the repository README for bootstrap instructions.'
