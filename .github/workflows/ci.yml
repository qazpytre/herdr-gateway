name: Gateway checks

on:
  pull_request:
    branches: [gateway]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.96.1
      - uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: gateway-contracts
      - name: Verify update ordering and remote setup contracts
        run: |
          cargo test --release --locked --bin herdr gateway_updates_order_base_versions_then_numeric_revisions
          cargo test --release --locked --test machine_setup --test machine_api
